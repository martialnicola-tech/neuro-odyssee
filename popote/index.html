<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Popote — Menus de la semaine, batch cooking & courses · Suisse & France</title>
  <meta name="description" content="Popote génère tes menus de la semaine, ta liste de courses chiffrée (CHF ou EUR) et ton plan de batch cooking. Gratuit, sans compte, hors-ligne. Suisse 🇨🇭 & France 🇫🇷.">
  <meta name="theme-color" content="#e85d3d">
  <meta property="og:title" content="Popote — On mange quoi cette semaine ?">
  <meta property="og:description" content="Menus personnalisés, batch cooking et liste de courses chiffrée pour la Suisse et la France. Gratuit et sans compte.">
  <meta property="og:type" content="website">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <noscript>
    <style>#app::before{content:"Popote a besoin de JavaScript pour cuisiner 🍲 Active-le puis recharge la page.";display:block;padding:40px 20px;text-align:center;font-family:sans-serif}</style>
  </noscript>
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav id="tabbar" aria-label="Navigation principale">
    <button data-tab="week"><i>📅</i>Semaine</button>
    <button data-tab="list"><i>🛒</i>Courses</button>
    <button data-tab="batch"><i>🍳</i>Batch</button>
    <button data-tab="fridge"><i>🧊</i>Frigo</button>
    <button data-tab="me"><i>⚙️</i>Profil</button>
  </nav>

  <div id="sheet" role="dialog" aria-modal="true">
    <div id="sheet-panel">
      <button id="sheet-close" aria-label="Fermer">✕</button>
      <div id="sheet-inner"></div>
    </div>
  </div>

  <div id="timer"><span>⏲</span><b id="timer-val">0:00</b><button id="timer-stop">stop</button></div>
  <div id="toast" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
