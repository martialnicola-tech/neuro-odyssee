name: Déploiement Popote → iasmart.tech
# L'app Popote se déploie sur https://iasmart.tech/popote/ (et pas sur
# neuro-odyssee.com — le workflow principal exclut popote/).
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   IASMART_FTP_HOST  hôte FTP du site iasmart.tech (ex. ftp.iasmart.tech)
#   IASMART_FTP_USER  utilisateur FTP dont la racine est le webroot d'iasmart.tech
#   IASMART_FTP_PASS  mot de passe FTP
on:
  push:
    branches: [main]
    paths: ['popote/**']
  workflow_dispatch:
concurrency:
  group: deploy-popote-iasmart
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Déployer popote/ (envoi seul, aucune suppression)
        env:
          FTP_HOST: ${{ secrets.IASMART_FTP_HOST }}
          FTP_USER: ${{ secrets.IASMART_FTP_USER }}
          FTP_PASS: ${{ secrets.IASMART_FTP_PASS }}
        run: |
          # Selon le compte FTP Hostinger, la racine est le webroot lui-même
          # ou le dossier parent contenant public_html — on détecte.
          if lftp -c "set ssl:verify-certificate no; set ftp:ssl-allow true; set ftp:ssl-force false; open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST'; cls -1" | grep -qx 'public_html/*'; then
            TARGET='./public_html/popote/'
          else
            TARGET='./popote/'
          fi
          echo "Cible de déploiement : $TARGET"
          lftp -c "
          set cmd:fail-exit yes;
          set ssl:verify-certificate no;
          set ftp:ssl-allow true; set ftp:ssl-force false;
          open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
          mirror --reverse --verbose --no-perms --parallel=2 \
            --exclude-glob '*.md' \
            ./popote/ $TARGET ;
          "
